name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package (ad-hoc signed, unnotarized)
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-unsigned-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14
